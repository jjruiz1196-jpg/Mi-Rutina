<style>
  :root {
    color-scheme: light dark;
    --ink: #16171b;
    --paper: #f1efe9;
    --surface: #ffffff;
    --line: #dcd8ce;
    --muted: #6f6b62;
    --accent: #cc3d2c;
    --accent-ink: #ffffff;
    --grow: #2f6f52;
    --grow-soft: #e4efe8;
    --warn: #b5760a;
    --warn-soft: #f4e9d6;
    --danger: #b23a34;
    --font-display: 'Barlow Condensed', system-ui, sans-serif;
    --font-body: 'Public Sans', system-ui, -apple-system, sans-serif;
    --font-mono: 'IBM Plex Mono', ui-monospace, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --ink: #f1efe9;
      --paper: #131316;
      --surface: #1c1d21;
      --line: #313236;
      --muted: #9b968c;
      --accent: #ff6b52;
      --accent-ink: #14151a;
      --grow: #59c98c;
      --grow-soft: #16261d;
      --warn: #e0a63c;
      --warn-soft: #2b2213;
      --danger: #ff7a70;
    }
  }
  :root[data-theme="dark"] {
    --ink: #f1efe9;
    --paper: #131316;
    --surface: #1c1d21;
    --line: #313236;
    --muted: #9b968c;
    --accent: #ff6b52;
    --accent-ink: #14151a;
    --grow: #59c98c;
    --grow-soft: #16261d;
    --warn: #e0a63c;
    --warn-soft: #2b2213;
    --danger: #ff7a70;
  }

  * { box-sizing: border-box; }
  body { background: var(--paper); color: var(--ink); font-family: var(--font-body); margin: 0; }
  h1, h2, h3, .display { font-family: var(--font-display); font-weight: 600; letter-spacing: 0.01em; text-wrap: balance; }
  .num { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
  a { color: inherit; }
  button, input, select { font-family: inherit; font-size: inherit; color: inherit; }
  ::selection { background: var(--accent); color: var(--accent-ink); }

  .shell { max-width: 640px; margin: 0 auto; padding: 0 20px 64px; }

  /* --- App bar --- */
  .appbar {
    position: sticky; top: env(safe-area-inset-top, 0px); z-index: 30;
    background: color-mix(in srgb, var(--paper) 88%, transparent);
    backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--line);
  }
  .appbar-inner { max-width: 640px; margin: 0 auto; padding: 18px 20px 0; }
  .appbar h1 { font-size: 28px; line-height: 1; margin: 0 0 2px; }
  .appbar p.sub { margin: 0 0 14px; color: var(--muted); font-size: 13px; }
  .tabs { display: flex; gap: 2px; overflow-x: auto; -webkit-overflow-scrolling: touch; scrollbar-width: none; }
  .tabs::-webkit-scrollbar { display: none; }
  .tab {
    display: flex; align-items: center; gap: 6px; white-space: nowrap;
    padding: 10px 12px; border: none; background: none; color: var(--muted);
    font-size: 13px; font-weight: 600; border-bottom: 2px solid transparent; cursor: pointer;
  }
  .tab svg { width: 16px; height: 16px; flex: none; }
  .tab.active { color: var(--ink); border-bottom-color: var(--accent); }

  /* --- Icon --- */
  .icon { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }

  /* --- Hero mark (Rutina tab) --- */
  .hero { margin: 20px 0 18px; }
  .hero svg { width: 100%; height: auto; display: block; }

  /* --- Cards / sections --- */
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 4px; padding: 18px; margin-bottom: 14px; }
  .card + .card { margin-top: 0; }

let memoryStore = {};
let storageOk = true;
try { localStorage.setItem('__t','1'); localStorage.removeItem('__t'); } catch(e){ storageOk = false; }
if(!storageOk) document.getElementById('storage-warning').hidden = false;

function loadJSON(key, fallback){
  try{
    if(storageOk){ const v = localStorage.getItem(key); return v ? JSON.parse(v) : fallback; }
    return memoryStore[key] !== undefined ? memoryStore[key] : fallback;
  }catch(e){ return fallback; }
}
function saveJSON(key, value){
  try{ if(storageOk) localStorage.setItem(key, JSON.stringify(value)); else memoryStore[key] = value; }
  catch(e){ memoryStore[key] = value; }
}
const LOGS_KEY = 'rutina_logs_v2';
const START_KEY = 'rutina_start_v2';
let logs = loadJSON(LOGS_KEY, []);
let startDate = loadJSON(START_KEY, null);

/* ============================================================
   3) UTILIDADES
   ============================================================ */
function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function todayStr(){ return new Date().toISOString().slice(0,10); }
function fmtDate(s){ const [y,m,d] = s.split('-'); return `${d}/${m}/${y}`; }
function esc(s){ return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function weekForDate(dateStr){
  if(!startDate) return 1;
  const diff = Math.floor((new Date(dateStr+'T00:00:00') - new Date(startDate+'T00:00:00')) / 86400000);
  return Math.min(26, Math.max(1, Math.floor(diff/7)+1));
}
function blockInfo(week){
  if(week<=6) return {i:0, deload: week===6, transition:false};
  if(week<=12) return {i:1, deload: week===12, transition:false};
  if(week<=18) return {i:2, deload: week===18, transition:false};
  if(week<=24) return {i:3, deload: week===24, transition:false};
  return {i:0, deload:false, transition:true};
}
function toast(msg, kind='ok'){
  const box = document.getElementById('toast-box');
  const t = document.createElement('div');
  t.className = 'toast';
  if(kind==='danger') t.style.background = 'var(--danger)';
  t.textContent = msg;
  box.appendChild(t);
  setTimeout(()=> t.remove(), 2600);
}

let reg = { date: todayStr(), week: null, dayId: 1, rows: [], key: null };

  const info = blockInfo(reg.week);
  const block = PLAN[info.i];
  const day = block.days.find(d=>d.id===reg.dayId) || block.days[0];
  const key = block.name + '-' + day.id;
  if(reg.key !== key){
    reg.rows = day.exercises.map(ex => ({ original: ex.n, name: ex.n, target: ex, skip:false, weight:'', sets: ex.s, reps:'', rir:'', note:'', isSub:false }));

    </div>

    <div class="card">
      <p class="eyebrow">${esc(day.tag)}</p>
      <h3 style="margin:0 0 12px;font-size:17px;">${day.title}</h3>
      <div id="exlist"></div>
      <button class="btn ghost" id="add-ex">${ICONS.plus} Añadir ejercicio o sustituto</button>
    </div>

    <button class="btn primary block" id="save-session">${ICONS.check} Guardar sesión</button>
  `;

  document.getElementById('f-date').addEventListener('change', e=>{ reg.date = e.target.value; reg.week = weekForDate(reg.date); renderRegistrar(); });
  document.getElementById('f-week').addEventListener('change', e=>{
    let w = parseInt(e.target.value)||1; w = Math.min(26, Math.max(1,w));

  });

    const b = e.target.closest('button'); if(!b) return;
    reg.dayId = parseInt(b.dataset.day); renderRegistrar();
  });
  document.getElementById('add-ex').addEventListener('click', ()=>{
    const name = prompt('Nombre del ejercicio (sustituto o extra):');
    if(name && name.trim()){
      reg.rows.push({ original:name.trim(), name:name.trim(), target:{s:3,r:'',rir:null}, skip:false, weight:'', sets:3, reps:'', rir:'', note:'', isSub:true });
      renderExList();
    }
  });
  document.getElementById('save-session').addEventListener('click', ()=>{
    const wk = parseInt(document.getElementById('f-week').value) || reg.week;
    const toSave = reg.rows.filter(r=>!r.skip && (r.weight!=='' || r.reps!==''));
    if(toSave.length===0){ toast('No hay datos para guardar', 'danger'); return; }
    const sessionId = uid();
    toSave.forEach(r=>{
      logs.push({
        id: uid(), sessionId, date: reg.date, week: wk, dayTitle: `${day.title} · ${day.tag}`,
        exercise: r.name, original: r.original, isSub: r.isSub,
        weight: r.weight===''? null : parseFloat(r.weight),
        sets: r.sets===''? null : parseInt(r.sets),
        reps: r.reps, rir: r.rir===''? null : parseFloat(r.rir), note: r.note,
      });
    });
    saveJSON(LOGS_KEY, logs);
    toast(`Sesión guardada (${toSave.length} ejercicios)`);

          </div>
          <label class="exrow-skip"><input type="checkbox" data-skip="${idx}" ${row.skip?'checked':''}> No hecho hoy</label>

          <div class="field"><label>Kg</label><input type="number" step="0.5" inputmode="decimal" data-f="weight" data-i="${idx}" value="${row.weight}" ${row.skip?'disabled':''}></div>
          <div class="field"><label>Series</label><input type="number" inputmode="numeric" data-f="sets" data-i="${idx}" value="${row.sets}" ${row.skip?'disabled':''}></div>
          <div class="field"><label>Reps</label><input type="text" data-f="reps" data-i="${idx}" value="${row.reps}" ${row.skip?'disabled':''}></div>
          <div class="field"><label>RIR</label><input type="number" step="0.5" inputmode="decimal" data-f="rir" data-i="${idx}" value="${row.rir}" ${row.skip?'disabled':''}></div>
          <div class="field"><label>Nota</label><input type="text" data-f="note" data-i="${idx}" value="${row.note}" ${row.skip?'disabled':''}></div>
        </div>
      </div>

    wrap.querySelectorAll('input[data-f]').forEach(inp=>{
      inp.addEventListener('input', ()=> reg.rows[parseInt(inp.dataset.i)][inp.dataset.f] = inp.value);
    });
    wrap.querySelectorAll('input[data-skip]').forEach(inp=>{
      inp.addEventListener('change', ()=>{ reg.rows[parseInt(inp.dataset.skip)].skip = inp.checked; renderExList(); });
    });
    wrap.querySelectorAll('[data-rename]').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        const idx = parseInt(btn.dataset.rename);
        const name = prompt('Nuevo nombre del ejercicio:', reg.rows[idx].name);
        if(name && name.trim()){
          reg.rows[idx].name = name.trim();
          reg.rows[idx].isSub = name.trim() !== reg.rows[idx].original;
          renderExList();
        }
      });
    });
  }
}

function renderHistorial(){
  const el = document.getElementById('panel-historial');
  if(logs.length===0){
    el.innerHTML = `<div class="empty">${ICONS.empty}<p>Todavía no registraste ninguna sesión.</p></div>`;
    return;
  }
  const bySession = {};
  logs.forEach(l => (bySession[l.sessionId] = bySession[l.sessionId] || []).push(l));
  const sessions = Object.entries(bySession).sort((a,b)=> b[1][0].date.localeCompare(a[1][0].date));

  el.innerHTML = `
    <div class="field search" style="margin-bottom:14px;">
      <input id="hist-search" type="search" placeholder="Buscar ejercicio…">
    </div>
    <div id="hist-list"></div>
  `;
  const draw = (q='') => {
    const f = q.trim().toLowerCase();
    document.getElementById('hist-list').innerHTML = sessions.map(([sid, rows]) => {
      const visible = f ? rows.filter(r => r.exercise.toLowerCase().includes(f)) : rows;
      if(f && visible.length===0) return '';
      const first = rows[0];
      return `
      <div class="session">
        <div class="session-head">
          <div><span class="d">${fmtDate(first.date)}</span><span class="m">Semana ${first.week} · ${esc(first.dayTitle)}</span></div>
          <button class="icon-btn" data-delsession="${sid}" title="Eliminar sesión">${ICONS.trash}</button>
        </div>
        ${visible.map(r => `
          <div class="entry" data-row="${r.id}">
            <div>
              <span class="name">${esc(r.exercise)}</span>
              ${r.isSub ? `<span class="chip warn" style="padding:2px 7px;">sust. de ${esc(r.original)}</span>` : ''}
              ${r.note ? `<div style="color:var(--muted);font-size:11.5px;margin-top:2px;">${esc(r.note)}</div>` : ''}
            </div>
            <div class="figs">
              <span><b>${r.weight ?? '—'}</b> kg</span>
              <span>${r.sets ?? '—'}×${esc(r.reps || '—')}</span>
              <span>RIR ${r.rir ?? '—'}</span>
              <span class="actions">
                <button class="icon-btn" data-edit="${r.id}">${ICONS.edit}</button>
                <button class="icon-btn" data-del="${r.id}">${ICONS.trash}</button>
              </span>
            </div>
          </div>
        `).join('')}
      </div>`;
    }).join('');
    wireHist();
  };
  function wireHist(){
    document.querySelectorAll('[data-del]').forEach(b=> b.addEventListener('click', ()=>{
      if(!confirm('¿Eliminar este registro?')) return;
      logs = logs.filter(l=>l.id!==b.dataset.del); saveJSON(LOGS_KEY, logs); toast('Registro eliminado'); renderHistorial();
    }));
    document.querySelectorAll('[data-delsession]').forEach(b=> b.addEventListener('click', ()=>{
      if(!confirm('¿Eliminar toda la sesión?')) return;
      logs = logs.filter(l=>l.sessionId!==b.dataset.delsession); saveJSON(LOGS_KEY, logs); toast('Sesión eliminada'); renderHistorial();
    }));
    document.querySelectorAll('[data-edit]').forEach(b=> b.addEventListener('click', ()=>{
      const log = logs.find(l=>l.id===b.dataset.edit);
      const row = document.querySelector(`[data-row="${log.id}"]`);
      row.innerHTML = `<div class="edit-inline">
        <input type="number" step="0.5" value="${log.weight ?? ''}" data-ef="weight" placeholder="kg">
        <input type="number" value="${log.sets ?? ''}" data-ef="sets" placeholder="series">
        <input type="text" value="${log.reps ?? ''}" data-ef="reps" placeholder="reps">
        <input type="number" step="0.5" value="${log.rir ?? ''}" data-ef="rir" placeholder="RIR">
        <input type="text" class="wide" value="${esc(log.note ?? '')}" data-ef="note" placeholder="nota">
        <button class="btn primary" data-savee style="padding:8px 14px;">${ICONS.check}</button>
      </div>`;
      row.querySelector('[data-savee]').addEventListener('click', ()=>{
        const get = f => row.querySelector(`[data-ef="${f}"]`).value;
        log.weight = get('weight')===''?null:parseFloat(get('weight'));
        log.sets = get('sets')===''?null:parseInt(get('sets'));
        log.reps = get('reps'); log.rir = get('rir')===''?null:parseFloat(get('rir')); log.note = get('note');
        saveJSON(LOGS_KEY, logs); toast('Registro actualizado'); renderHistorial();
      });
    }));
  }
  draw();
  document.getElementById('hist-search').addEventListener('input', e=> draw(e.target.value));
}

  const names = [...new Set(logs.filter(l=>l.weight!=null).map(l=>l.exercise))].sort();
  const weeks = [...new Set(logs.map(l=>l.week))].sort((a,b)=>a-b);
  let streak = weeks.length ? 1 : 0;
  for(let i=weeks.length-1;i>0;i--){ if(weeks[i]-weeks[i-1]===1) streak++; else break; }

  let best = null;
  names.forEach(name=>{
    const e = logs.filter(l=>l.exercise===name && l.weight!=null).sort((a,b)=>a.date.localeCompare(b.date));
    if(e.length>=2 && e[0].weight>0){
      const pct = (e[e.length-1].weight - e[0].weight)/e[0].weight*100;
      if(!best || pct>best.pct) best = {name, pct};
    }
  });
  const records = names.map(name=>{
    const e = logs.filter(l=>l.exercise===name && l.weight!=null);
    const max = e.reduce((a,b)=> b.weight>a.weight?b:a, e[0]);
    return {name, weight:max.weight, date:max.date};
  }).sort((a,b)=>b.weight-a.weight);

  el.innerHTML = `
    <div class="stats">
      <div class="stat">${ICONS.flame}<div class="val num">${streak}</div><div class="lbl">Semanas seguidas</div></div>
      <div class="stat">${ICONS.trend}<div class="val num">${best ? best.pct.toFixed(0)+'%' : '—'}</div><div class="lbl">${best ? esc(best.name) : 'Sin datos aún'}</div></div>
      <div class="stat">${ICONS.medal}<div class="val num">${records[0] ? records[0].weight+'kg' : '—'}</div><div class="lbl">${records[0] ? esc(records[0].name) : ''}</div></div>
    </div>

    <div class="card">
      <p class="eyebrow">Progresión de peso</p>
      <select id="exSelect">${names.map(n=>`<option value="${esc(n)}">${esc(n)}</option>`).join('')}</select>
      <div class="chart-wrap"><canvas id="weightChart" height="180"></canvas></div>
    </div>

    <div class="card">
      <p class="eyebrow">Volumen semanal</p>
      <p class="lead" style="margin-bottom:8px;">Peso × series × reps, sumado por semana.</p>
      <div class="chart-wrap"><canvas id="volumeChart" height="180"></canvas></div>
    </div>

    <div class="card">
      <p class="eyebrow">Récords personales</p>
      <table class="plan">
        <thead><tr><th>Ejercicio</th><th class="c">Máximo</th><th class="c">Fecha</th></tr></thead>
        <tbody>${records.map(r=>`<tr><td class="n">${esc(r.name)}</td><td class="c num">${r.weight} kg</td><td class="c num">${fmtDate(r.date)}</td></tr>`).join('')}</tbody>
      </table>
    </div>
  `;

  const styles = getComputedStyle(document.documentElement);
  const accent = styles.getPropertyValue('--accent').trim();
  const ink = styles.getPropertyValue('--ink').trim();
  const muted = styles.getPropertyValue('--muted').trim();
  const line = styles.getPropertyValue('--line').trim();
  Chart.defaults.font.family = "'Public Sans', system-ui, sans-serif";
  Chart.defaults.color = muted;

  function drawWeight(name){
    const e = logs.filter(l=>l.exercise===name && l.weight!=null).sort((a,b)=>a.date.localeCompare(b.date));
    if(chartWeight) chartWeight.destroy();
    chartWeight = new Chart(document.getElementById('weightChart'), {
      type:'line',
      data:{ labels: e.map(x=>fmtDate(x.date)), datasets:[{ label:name+' (kg)', data:e.map(x=>x.weight), borderColor:accent, backgroundColor:accent+'22', fill:true, tension:0.25, pointRadius:3, pointBackgroundColor:accent }]},
      options:{ responsive:true, plugins:{legend:{display:false}}, scales:{ x:{grid:{color:line}}, y:{grid:{color:line}} } }
    });
  }
  drawWeight(names[0]);
  document.getElementById('exSelect').addEventListener('change', e=> drawWeight(e.target.value));

  const volByWeek = {};
  logs.forEach(l=>{
    if(l.weight==null || l.sets==null) return;
    const reps = parseFloat(l.reps) || 0; if(!reps) return;
    volByWeek[l.week] = (volByWeek[l.week]||0) + l.weight*l.sets*reps;
  });
  const ws = Object.keys(volByWeek).map(Number).sort((a,b)=>a-b);
  if(chartVolume) chartVolume.destroy();
  chartVolume = new Chart(document.getElementById('volumeChart'), {
    type:'bar',
    data:{ labels: ws.map(w=>'S'+w), datasets:[{ label:'Volumen', data: ws.map(w=>Math.round(volByWeek[w])), backgroundColor: ink }]},
    options:{ responsive:true, plugins:{legend:{display:false}}, scales:{ x:{grid:{display:false}}, y:{grid:{color:line}} } }
  });
}

/* ============================================================
   9) AJUSTES
   ============================================================ */
function renderAjustes(){
  const el = document.getElementById('panel-ajustes');
  el.innerHTML = `
    <div class="card">
      <p class="eyebrow">Fecha de inicio</p>
      <p class="lead" style="margin-bottom:10px;">Se usa para calcular en qué semana estás al registrar una sesión. Siempre podés corregir la semana a mano en Registrar.</p>
      <div class="row2">
        <div class="field"><input id="start-date" type="date" value="${startDate || todayStr()}"></div>
        <button class="btn primary" id="save-start">${ICONS.check} Guardar</button>
      </div>
    </div>
    <div class="card">
      <p class="eyebrow">Datos</p>
      <ul class="settings-list">
        <li>Se guardan en la memoria de este navegador, en este dispositivo.</li>
        <li>No se envían a ningún servidor ni se comparten con nadie.</li>
        <li>Si abrís esta app desde otro navegador o equipo, no vas a ver este historial ahí.</li>
      </ul>
      <button class="btn danger-btn" id="wipe" style="margin-top:14px;">${ICONS.trash} Borrar todos los registros</button>
    </div>
  `;
  document.getElementById('save-start').addEventListener('click', ()=>{
    startDate = document.getElementById('start-date').value;
    saveJSON(START_KEY, startDate);
    toast('Fecha de inicio guardada');
  });
  document.getElementById('wipe').addEventListener('click', ()=>{
    if(!confirm('¿Borrar TODOS tus registros? No se puede deshacer.')) return;
    logs = []; saveJSON(LOGS_KEY, logs); toast('Registros borrados'); renderAjustes();
  });
}

/* ============================================================
   10) INICIO
   ============================================================ */
const isStandalone = window.navigator.standalone === true || window.matchMedia('(display-mode: standalone)').matches;
if(isStandalone) goTab('registrar'); else renderRutina();
</script>
